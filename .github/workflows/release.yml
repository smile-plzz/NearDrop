name: Test, build, and release Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neardrop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Integration tests
        run: python -m unittest discover -s tests -p test_server.py -v
      - name: Install launcher compiler
        run: python -m pip install ziglang==0.13.0
      - name: Build native launcher
        shell: cmd
        run: python -m ziglang cc -target x86_64-windows-gnu -Os -municode -Wl,--subsystem,windows tools/launcher.c tools/launcher.rc -o NearDrop.exe -luser32
      - name: Download official Python runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip -OutFile runtime.zip
          if ((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLower() -ne 'd297e5ff019966817ad8502465176139f2d3d840fa4ed84b13bed399a6ab1f15') { throw 'Runtime checksum mismatch' }
      - name: Package
        run: python tools/package.py --runtime-zip runtime.zip
      - name: Test extracted portable application on Windows
        run: python tests/portable_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: NearDrop-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish versioned release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0,'app'); import server; print(server.VERSION)"
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and application version do not match' }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; preserving its assets."; exit 0 }
          $assets = @(Get-ChildItem dist/*.zip | ForEach-Object FullName) + @((Resolve-Path dist/SHA256SUMS.txt).Path)
          gh release create $tag @assets --target $env:GITHUB_SHA --title "NearDrop $tag" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
